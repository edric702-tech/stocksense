<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockSense AI</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap');

  :root {
    --bg: #080810;
    --surface: #0f0f1a;
    --border: #1a1a2e;
    --accent: #7c3aed;
    --accent-light: #a855f7;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #eab308;
    --text: #f1f0f9;
    --muted: #6b7280;
    --card: #0d0d1c;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  .glow {
    position: fixed;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(124,58,237,0.12) 0%, transparent 70%);
    top: -200px;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: none;
  }

  .wrap { max-width: 800px; margin: 0 auto; padding: 0 16px 80px; position: relative; z-index: 1; }

  /* NAV */
  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 0 16px;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }

  .logo-icon {
    width: 34px;
    height: 34px;
    background: linear-gradient(135deg, var(--accent), var(--accent-light));
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }

  .logo span { color: var(--accent-light); }

  .nav-tag {
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--accent-light);
    border: 1px solid rgba(168,85,247,0.3);
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: 1px;
  }

  /* HERO */
  .hero {
    text-align: center;
    padding: 48px 0 36px;
  }

  .hero-eyebrow {
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--accent-light);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 16px;
    opacity: 0.8;
  }

  .hero-title {
    font-size: clamp(28px, 6vw, 42px);
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1.15;
    margin-bottom: 14px;
  }

  .hero-title .highlight {
    background: linear-gradient(135deg, var(--accent-light), #60a5fa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero-sub {
    font-size: 15px;
    color: var(--muted);
    margin-bottom: 36px;
    line-height: 1.6;
  }

  /* SEARCH */
  .search-wrap {
    max-width: 500px;
    margin: 0 auto;
  }

  .search-box {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    background: var(--surface);
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .search-box:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124,58,237,0.15);
  }

  #tickerInput {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    padding: 15px 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    color: var(--text);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  #tickerInput::placeholder {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    letter-spacing: 0;
    color: var(--muted);
    text-transform: none;
  }

  #analyzeBtn {
    background: linear-gradient(135deg, var(--accent), var(--accent-light));
    border: none;
    padding: 15px 24px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: white;
    transition: opacity 0.15s;
    white-space: nowrap;
  }

  #analyzeBtn:hover { opacity: 0.85; }
  #analyzeBtn:disabled { opacity: 0.4; cursor: not-allowed; }

  .quick-picks {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 14px;
  }

  .qp {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 5px 12px;
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--muted);
    cursor: pointer;
    background: transparent;
    transition: all 0.15s;
  }

  .qp:hover {
    border-color: var(--accent-light);
    color: var(--accent-light);
    background: rgba(168,85,247,0.06);
  }

  /* LOADING */
  #loading {
    display: none;
    text-align: center;
    padding: 50px 0;
  }

  .spinner {
    width: 40px;
    height: 40px;
    border: 2px solid var(--border);
    border-top-color: var(--accent-light);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 16px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-txt {
    font-size: 13px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 1px;
  }

  /* ERROR */
  #errorBox {
    display: none;
    margin-top: 20px;
    background: rgba(239,68,68,0.07);
    border: 1px solid rgba(239,68,68,0.2);
    border-radius: 10px;
    padding: 16px;
  }

  .err-title { color: var(--red); font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .err-raw { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted); white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto; background: var(--bg); padding: 10px; border-radius: 6px; margin-top: 8px; }

  /* RESULTS */
  #results { display: none; }

  .ticker-bar {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 28px 0 20px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 12px;
  }

  .ticker-sym {
    font-family: 'JetBrains Mono', monospace;
    font-size: 30px;
    font-weight: 700;
    color: var(--accent-light);
    letter-spacing: 3px;
  }

  .ticker-co { font-size: 13px; color: var(--muted); margin-top: 5px; }

  .verdict {
    padding: 8px 20px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    align-self: flex-start;
  }

  .v-buy { background: rgba(34,197,94,0.1); color: var(--green); border: 1px solid rgba(34,197,94,0.25); }
  .v-hold { background: rgba(234,179,8,0.1); color: var(--yellow); border: 1px solid rgba(234,179,8,0.25); }
  .v-avoid { background: rgba(239,68,68,0.1); color: var(--red); border: 1px solid rgba(239,68,68,0.25); }
  .v-watch { background: rgba(96,165,250,0.1); color: #60a5fa; border: 1px solid rgba(96,165,250,0.25); }

  /* GRID */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .full { grid-column: 1 / -1; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
  }

  .card-label {
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }

  /* Summary */
  .summary { font-size: 14px; line-height: 1.75; color: #d1d0e0; }

  /* Levels */
  .level-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .level-row:last-child { border-bottom: none; }
  .level-name { font-size: 12px; color: var(--muted); }
  .level-val { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; }

  /* Snapshot */
  .snap-items { display: flex; flex-direction: column; gap: 14px; }
  .snap-val { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; margin-bottom: 2px; }
  .snap-lbl { font-size: 11px; color: var(--muted); }

  /* Catalysts */
  .catalyst {
    display: flex;
    gap: 12px;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 8px;
    border: 1px solid transparent;
  }
  .catalyst:last-child { margin-bottom: 0; }
  .c-bull { background: rgba(34,197,94,0.04); border-color: rgba(34,197,94,0.12); }
  .c-bear { background: rgba(239,68,68,0.04); border-color: rgba(239,68,68,0.12); }
  .c-event { background: rgba(96,165,250,0.04); border-color: rgba(96,165,250,0.12); }
  .c-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
  .c-tag {
    display: inline-block;
    font-size: 9px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 1px;
    padding: 2px 7px;
    border-radius: 4px;
    margin-bottom: 5px;
    text-transform: uppercase;
  }
  .t-bull { background: rgba(34,197,94,0.12); color: var(--green); }
  .t-bear { background: rgba(239,68,68,0.12); color: var(--red); }
  .t-event { background: rgba(96,165,250,0.12); color: #60a5fa; }
  .c-text { font-size: 13px; line-height: 1.55; color: #c0bfd6; }

  /* Options meter */
  .meter-row { display: flex; align-items: center; gap: 12px; }
  .meter-lbl { font-size: 11px; color: var(--muted); min-width: 48px; }
  .meter-lbl.right { text-align: right; }
  .meter-track {
    flex: 1;
    height: 8px;
    background: linear-gradient(90deg, var(--red), var(--yellow), var(--green));
    border-radius: 4px;
    position: relative;
  }
  .meter-dot {
    position: absolute;
    top: -4px;
    width: 16px;
    height: 16px;
    background: white;
    border-radius: 50%;
    border: 2px solid var(--bg);
    transform: translateX(-50%);
    box-shadow: 0 0 10px rgba(255,255,255,0.3);
  }
  .options-note { font-size: 13px; color: var(--muted); margin-top: 12px; line-height: 1.6; }

  /* Disclaimer */
  .disclaimer {
    margin-top: 18px;
    padding: 12px 16px;
    border-radius: 8px;
    background: rgba(234,179,8,0.05);
    border: 1px solid rgba(234,179,8,0.12);
    font-size: 11px;
    color: var(--muted);
    line-height: 1.6;
  }

  @media (max-width: 540px) {
    .grid { grid-template-columns: 1fr; }
    .full { grid-column: 1; }
  }
</style>
</head>
<body>
<div class="glow"></div>
<div class="wrap">

  <nav>
    <div class="logo">
      <div class="logo-icon">📈</div>
      Stock<span>Sense</span>
    </div>
    <div class="nav-tag">AI POWERED</div>
  </nav>

  <div class="hero">
    <div class="hero-eyebrow">Instant AI Stock Research</div>
    <div class="hero-title">Make smarter trades with<br><span class="highlight">AI-powered insights</span></div>
    <div class="hero-sub">Get a full breakdown of any stock in seconds — levels, sentiment, catalysts, and a plain-English verdict.</div>

    <div class="search-wrap">
      <div class="search-box">
        <input type="text" id="tickerInput" placeholder="Type a ticker — NVDA, AAPL, ACN..." maxlength="10" />
        <button id="analyzeBtn" onclick="analyze()">Analyze →</button>
      </div>
      <div class="quick-picks">
        <button class="qp" onclick="analyze('NVDA')">NVDA</button>
        <button class="qp" onclick="analyze('AMZN')">AMZN</button>
        <button class="qp" onclick="analyze('GOOGL')">GOOGL</button>
        <button class="qp" onclick="analyze('ACN')">ACN</button>
        <button class="qp" onclick="analyze('TSLA')">TSLA</button>
        <button class="qp" onclick="analyze('PLTR')">PLTR</button>
      </div>
    </div>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-txt" id="loadingTxt">Analyzing...</div>
  </div>

  <div id="errorBox">
    <div class="err-title" id="errTitle">Error</div>
    <div class="err-raw" id="errRaw"></div>
  </div>

  <div id="results"></div>

</div>

<script>
const API_KEY = "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";

document.getElementById('tickerInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') analyze();
});

function verdictClass(v = '') {
  v = v.toLowerCase();
  if (v.includes('buy') || v.includes('bullish')) return 'v-buy';
  if (v.includes('avoid') || v.includes('sell') || v.includes('bearish')) return 'v-avoid';
  if (v.includes('hold')) return 'v-hold';
  return 'v-watch';
}

function catalystClass(type) {
  if (type === 'bull') return { wrap: 'c-bull', tag: 't-bull', icon: '▲' };
  if (type === 'bear') return { wrap: 'c-bear', tag: 't-bear', icon: '▼' };
  return { wrap: 'c-event', tag: 't-event', icon: '◆' };
}

function levelColor(label) {
  if (label.toLowerCase().includes('stop')) return '#ef4444';
  if (label.toLowerCase().includes('resist')) return '#f97316';
  return '#22c55e';
}

async function analyze(t) {
  const sym = (t || document.getElementById('tickerInput').value).trim().toUpperCase();
  if (!sym) return;
  document.getElementById('tickerInput').value = sym;

  document.getElementById('results').style.display = 'none';
  document.getElementById('errorBox').style.display = 'none';
  document.getElementById('loading').style.display = 'block';
  document.getElementById('loadingTxt').textContent = 'Analyzing ' + sym + '...';
  document.getElementById('analyzeBtn').disabled = true;

  const prompt = `You are a professional stock analyst. Analyze ticker: ${sym}.

Reply with ONLY a raw JSON object. No markdown, no backticks, no explanation. Start with { end with }.

{
  "company_name": "Full company name",
  "verdict": "Buy",
  "summary": "3-4 sentence direct analysis. Be opinionated like a real trader.",
  "levels": {
    "support_strong": 120.00,
    "support": 130.00,
    "resistance": 155.00,
    "stop_loss": 115.00
  },
  "momentum_score": 74,
  "earnings_date": "Jun 26",
  "analyst_rating": "Strong Buy",
  "catalysts": [
    {"type": "bull", "label": "Tailwind", "text": "Main bullish reason"},
    {"type": "bear", "label": "Risk", "text": "Main risk to watch"},
    {"type": "event", "label": "Catalyst", "text": "Upcoming event"}
  ],
  "options_sentiment_pct": 68,
  "options_summary": "What options flow is signaling right now."
}`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': API_KEY,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(JSON.stringify(data));
    }

    const raw = (data.content || []).map(b => b.text || '').join('').trim();

    let parsed = null;
    try { parsed = JSON.parse(raw); } catch(_) {}
    if (!parsed) {
      const m = raw.match(/\{[\s\S]*\}/);
      if (m) try { parsed = JSON.parse(m[0]); } catch(_) {}
    }
    if (!parsed) throw new Error('Parse failed. Raw: ' + raw.slice(0, 300));

    renderResults(parsed, sym);

  } catch(err) {
    document.getElementById('errorBox').style.display = 'block';
    document.getElementById('errTitle').textContent = '⚠ Error — ' + err.message.slice(0, 80);
    document.getElementById('errRaw').textContent = err.message;
  } finally {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('analyzeBtn').disabled = false;
  }
}

function renderResults(d, sym) {
  const vc = verdictClass(d.verdict);
  const levels = [
    { label: 'Strong Support', value: d.levels?.support_strong },
    { label: 'Support', value: d.levels?.support },
    { label: 'Resistance', value: d.levels?.resistance },
    { label: 'Stop Loss', value: d.levels?.stop_loss },
  ];
  const mScore = d.momentum_score || 50;
  const mColor = mScore > 65 ? '#22c55e' : mScore < 40 ? '#ef4444' : '#eab308';

  document.getElementById('results').innerHTML = `
    <div class="ticker-bar">
      <div>
        <div class="ticker-sym">${sym}</div>
        <div class="ticker-co">${d.company_name || ''}</div>
      </div>
      <div class="verdict ${vc}">${d.verdict}</div>
    </div>

    <div class="grid">

      <div class="card full">
        <div class="card-label">AI Analysis</div>
        <div class="summary">${d.summary}</div>
      </div>

      <div class="card">
        <div class="card-label">Key Levels</div>
        ${levels.map(l => `
          <div class="level-row">
            <span class="level-name">${l.label}</span>
            <span class="level-val" style="color:${levelColor(l.label)}">$${l.value ?? '—'}</span>
          </div>
        `).join('')}
      </div>

      <div class="card">
        <div class="card-label">Snapshot</div>
        <div class="snap-items">
          <div>
            <div class="snap-val" style="color:${mColor}">${mScore}<span style="font-size:13px;opacity:0.6">/100</span></div>
            <div class="snap-lbl">Momentum Score</div>
          </div>
          <div>
            <div class="snap-val" style="color:#60a5fa;font-size:15px">${d.earnings_date || 'Unknown'}</div>
            <div class="snap-lbl">Next Earnings</div>
          </div>
          <div>
            <div class="snap-val" style="color:#22c55e;font-size:15px">${d.analyst_rating || '—'}</div>
            <div class="snap-lbl">Analyst Consensus</div>
          </div>
        </div>
      </div>

      <div class="card full">
        <div class="card-label">Catalysts & Risks</div>
        ${(d.catalysts || []).map(c => {
          const cs = catalystClass(c.type);
          return `
            <div class="catalyst ${cs.wrap}">
              <div class="c-icon" style="color:${c.type==='bull'?'#22c55e':c.type==='bear'?'#ef4444':'#60a5fa'}">${cs.icon}</div>
              <div>
                <span class="c-tag ${cs.tag}">${c.label}</span>
                <div class="c-text">${c.text}</div>
              </div>
            </div>
          `;
        }).join('')}
      </div>

      <div class="card full">
        <div class="card-label">Options Sentiment</div>
        <div class="meter-row">
          <span class="meter-lbl right">Bearish</span>
          <div class="meter-track">
            <div class="meter-dot" style="left:${d.options_sentiment_pct || 50}%"></div>
          </div>
          <span class="meter-lbl">Bullish</span>
        </div>
        <div class="options-note">${d.options_summary || ''}</div>
      </div>

    </div>

    <div class="disclaimer">
      ⚠ StockSense is AI-generated research for informational purposes only. Not financial advice. Always do your own research before making any trade.
    </div>
  `;
  document.getElementById('results').style.display = 'block';
}
</script>
</body>
</html>
